[package]
name = "toolwing-cli"
description = "tw: toolwing's tools on the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tw"
path = "src/main.rs"

[dependencies]
toolwing-core.workspace = true
toolwing-tools.workspace = true
toolwing-jq.workspace = true
# The builder API with owned strings: commands are made from the registry.
clap = { version = "4.6", features = ["string", "wrap_help"] }
clap_complete = "4.6"
# Keys in the order the tool gives them (cli.md: a documented, stable order).
serde_json = { version = "1", features = ["preserve_order"] }
# diff's headers: a file's time, as GNU writes it, in this computer's zone.
jiff = "0.2"
# sort -R's seed when no --random-source is given.
getrandom = "0.3"
# qrencode's error correction levels (qrencodes.rs).
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
insta = "1.49"
# gzip's compatibility cases: digests of the files a case leaves.
sha2 = "0.11"

[lints]
workspace = true
