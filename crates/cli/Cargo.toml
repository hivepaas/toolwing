[package]
name = "toolwing-cli"
description = "tw: toolwing's tools on the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tw"
path = "src/main.rs"

[dependencies]
toolwing-core.workspace = true
toolwing-tools.workspace = true
# The builder API with owned strings: commands are made from the registry.
clap = { version = "4.6", features = ["string", "wrap_help"] }
clap_complete = "4.6"
serde_json = "1"

[dev-dependencies]
insta = "1.49"

[lints]
workspace = true
