[package]
name = "toolwing-tools"
description = "toolwing's tools and their registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
toolwing-core.workspace = true
# JSON and the other formats, read and written as `tw jq` does.
toolwing-jq.workspace = true
data-encoding = "2.11"
percent-encoding = "2.3"
# URLs as WHATWG parses them, as browsers do (`url parse`).
url = "2.5"
uuid = { version = "1.29", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }
ulid = "1.2"
# X.509 certificates, PEM and DER (`cert`), in pure Rust.
x509-parser = "0.18"
# The hashes: RustCrypto's; BLAKE2b and BLAKE3 from the BLAKE3 team, as
# blake2 0.11 no longer takes a length at run time (b2sum -l).
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
blake2b_simd = "1.0"
blake3 = "1.8"
# HMAC over those hashes (`hmac`).
hmac = "0.13"
# Password hashes (`bcrypt`, `argon2`): Keats' bcrypt, as OpenBSD makes
# it; RustCrypto's Argon2 (RFC 9106), as the reference C makes it. Both
# without their own generators: salts come from getrandom, below.
bcrypt = { version = "0.19", default-features = false, features = ["std", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# The operating system's secure generator (`random`).
getrandom = "0.3"
# Case conversion: the word boundaries cargo and clap use.
heck = "0.5"
# Dates, times and time zones; the zone database is bundled, so `tw time`
# knows every zone in a container with no tzdata.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

# Regular expressions: Rust's own (linear time), and fancy-regex for
# look-around and backreferences (backtracking, with a limit).
regex = "1.13"
fancy-regex = "0.20"
# HTML character references as the WHATWG tokenizer reads them (`html`).
htmlize = { version = "1.1", features = ["unescape"] }
# QR codes (`qrencode`): the symbol by `qrcode` (ISO/IEC 18004), its split
# and mask chosen as libqrencode chooses them (qr.rs); PNG by `png`.
qrcode = { version = "0.14", default-features = false }
png = "0.18"
# Zstandard (`zstd`): hivepack's safe-Rust port of the reference's own
# library, libzstd 1.5.7, frames byte for byte as libzstd's, with its worker
# threads, whose frames the command writes. gzip's compression: zlib's
# deflate as hivepack ports it (gzip's own decoders are ported in gzip/).
hivepack = { version = "0.8", default-features = false, features = ["zstd", "deflate"] }
# Diffs: Myers, as GNU diff uses.
similar = "3.2"
# JWTs: signing and verifying, with its pure-Rust crypto (no C to build).
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
# JWT headers and claims, and JWKS files.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
