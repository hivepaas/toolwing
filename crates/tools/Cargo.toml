[package]
name = "toolwing-tools"
description = "toolwing's tools and their registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
toolwing-core.workspace = true
data-encoding = "2.11"
percent-encoding = "2.3"
uuid = { version = "1.29", features = ["v4", "v7"] }
# The hashes: RustCrypto's; BLAKE2b and BLAKE3 from the BLAKE3 team, as
# blake2 0.11 no longer takes a length at run time (b2sum -l).
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
blake2b_simd = "1.0"
blake3 = "1.8"

[lints]
workspace = true
