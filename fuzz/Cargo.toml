# Fuzz targets (docs/design/quality.md): one for each parser, and one that
# gives every tool any input. Nothing a tool is given may panic.
#
#   cargo +nightly fuzz run json -- -max_total_time=600
#
# Its own workspace, so the main one builds on stable; the vendored crates
# are patched in here too, or the targets would test jaq's own.
[package]
name = "toolwing-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
toolwing-core = { path = "../crates/core" }
toolwing-tools = { path = "../crates/tools" }
toolwing-jq = { path = "../crates/jq" }
# To check a parsed bcrypt hash as the tools do.
bcrypt = { version = "0.19", default-features = false, features = ["std"] }

[patch.crates-io]
jaq-json = { path = "../vendor/jaq-json" }
jaq-core = { path = "../vendor/jaq-core" }

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml"
path = "fuzz_targets/yaml.rs"
test = false
doc = false
bench = false

[[bin]]
